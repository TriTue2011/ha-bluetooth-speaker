name: Release integration

# HACS shows a version number and offers an update only for GitHub releases; without
# any it tracks bare commits and never says "update available". Every new version in
# the integration's manifest gets its release, with the notes of that CHANGELOG section.

on:
  push:
    branches: [main]
    paths:
      - custom_components/bluetooth_speaker/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the manifest version as a release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Read version and changelog notes
        id: info
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open("custom_components/bluetooth_speaker/manifest.json"))["version"]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          notes = match.group(1).strip() if match else f"Bluetooth Speaker {version}"
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          PY

      - name: Create the release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.info.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already released"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Bluetooth Speaker $TAG" --notes-file release-notes.md
